name: heal

# Runs Playwright's healer agent against a red pipeline, on a short leash.
#
# The leash is the point. The healer's own definition (.claude/agents/
# playwright-test-healer.md, generated by `playwright init-agents`) tells it to
# "do the most reasonable thing possible to pass the test" and permits it to
# `test.fixme()` anything it cannot fix. Given write access to main, that is a
# machine for turning red pipelines green without fixing anything.
#
# So:
#   - it may only touch tests/**
#   - it opens a pull request; it never pushes to main
#   - the guardrails in bug-hunt.yml run on that pull request, so if it reaches
#     for skip, fixme, a fixed sleep or a loosened assertion, its own PR goes red
#
# The agent proposes. The guardrails judge. A human merges.

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      hint:
        description: 'Optional context for the healer (e.g. which test to start with)'
        required: false
        default: ''

concurrency:
  group: heal
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  heal:
    name: propose a fix as a pull request
    # Only on a real failure, never after a green or cancelled run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # claude-code-action exchanges a GitHub OIDC token during setup. Without
      # this the job dies before the agent starts, with "Could not fetch an OIDC
      # token" — which reads like a problem with the Anthropic key and is not one.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out what actually failed, not whatever main looks like now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Heal the failing tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # A user-scoped token, not the built-in GITHUB_TOKEN. GitHub does not
          # run workflows on pull requests opened by GITHUB_TOKEN — a recursion
          # guard — so the guardrails would never judge the healer's own PR,
          # which is the whole point of this workflow.
          github_token: ${{ secrets.GH_PAT }}
          additional_permissions: |
            actions: read
          # The first attempt used acceptEdits alone. That auto-accepts file
          # edits but still prompts for MCP tool calls — and Playwright's healer
          # has no Bash at all; it drives tests exclusively through the
          # playwright-test MCP server. Cut off from MCP it cannot run a test or
          # read a snapshot, so it spent 47 turns collecting 24 permission
          # denials and changed nothing.
          #
          # The fix is an explicit allowlist rather than disabling permission
          # checks: these are exactly the tools the healer's own definition
          # declares, and nothing else. No shell, no network, no git.
          claude_args: >-
            --agent playwright-test-healer
            --permission-mode acceptEdits
            --allowedTools "Read Glob Grep LS Edit MultiEdit Write mcp__playwright-test"
          prompt: |
            The `tests` workflow failed on this commit. Diagnose and repair the
            failing Playwright tests.

            ${{ github.event.inputs.hint }}

            Hard rules — a pull request that breaks any of these will be rejected
            by the guardrails and closed:

            1. Only edit files under `tests/`. Do not touch playwright.config.ts,
               eslint.config.js, package.json, scripts/ or any workflow.
            2. Never use `test.skip`, `test.fixme`, `test.only`, or comment a test
               out. Your own agent definition permits `test.fixme()` — in this
               repository it is forbidden, and `pnpm lint` enforces that. If you
               genuinely cannot fix a test, leave it failing and say so.
            3. Never weaken an assertion to make it pass: no swapping toHaveText
               for toContainText, no replacing an exact count with
               toBeGreaterThan(0), no widening a regex until it matches anything.
            4. No `waitForTimeout` and no `waitUntil: 'networkidle'` — that one
               never settles on this application. Wait for a condition.
            5. Raising a timeout is not a fix.

            Before proposing anything, decide which of these it is and say so in
            the PR description: a product bug, a test bug, an environment problem,
            or a race. If it is a product bug, the correct outcome is to leave the
            test failing and explain the defect — do not "fix" the test.

            Verify with `pnpm lint` and by running the affected project, then open
            a pull request against `main`. Never push to `main` directly. In the
            description, state plainly what you changed, what you could not
            resolve, and what a reviewer should check by hand.
